services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${RAG_AGENT_API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      milvus-standalone:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${RAG_AGENT_POSTGRES_USER:-rag_agent}
      POSTGRES_PASSWORD: ${RAG_AGENT_POSTGRES_PASSWORD:-rag_agent}
      POSTGRES_DB: ${RAG_AGENT_POSTGRES_DB:-rag_agent}
    ports:
      - "127.0.0.1:${RAG_AGENT_POSTGRES_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${RAG_AGENT_REDIS_EXPOSED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RAG_AGENT_MINIO_ACCESS_KEY:-rag-agent}
      MINIO_ROOT_PASSWORD: ${RAG_AGENT_MINIO_SECRET_KEY:-rag-agent-secret}
    ports:
      - "127.0.0.1:${RAG_AGENT_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${RAG_AGENT_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${RAG_AGENT_MINIO_ACCESS_KEY:-rag-agent}
      MINIO_ROOT_PASSWORD: ${RAG_AGENT_MINIO_SECRET_KEY:-rag-agent-secret}
      MINIO_BUCKET: ${RAG_AGENT_MINIO_BUCKET:-rag-agent}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "127.0.0.1:${RAG_AGENT_MILVUS_EXPOSED_PORT:-19530}:19530"
      - "127.0.0.1:${RAG_AGENT_MILVUS_WEBUI_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  mineru:
    image: ${RAG_AGENT_MINERU_IMAGE:-mineru:latest}
    profiles: ["parser"]
    environment:
      MINERU_MODEL_SOURCE: ${RAG_AGENT_MINERU_MODEL_SOURCE:-local}
    ports:
      - "127.0.0.1:${RAG_AGENT_MINERU_API_PORT:-18002}:8000"
    entrypoint: mineru-api
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  paddlex:
    image: ${RAG_AGENT_PADDLEX_IMAGE:-paddlex:latest}
    profiles: ["parser"]
    ports:
      - "127.0.0.1:${RAG_AGENT_PADDLEX_API_PORT:-18003}:8080"
    command:
      - paddlex
      - --serve
      - --pipeline
      - ${RAG_AGENT_PADDLEX_PIPELINE:-layout_parsing}
      - --device
      - ${RAG_AGENT_PADDLEX_DEVICE:-cpu}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      milvus-standalone:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 5s

volumes:
  minio_data:
  milvus_data:
  milvus_etcd_data:
  milvus_minio_data:
  postgres_data:
  redis_data:
