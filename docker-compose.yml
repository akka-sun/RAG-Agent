services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-agent-api-dev
    working_dir: /app
    volumes:
      - .:/app
      - api_venv:/app/.venv
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    container_name: rag-agent-postgres-dev
    environment:
      POSTGRES_USER: rag_agent
      POSTGRES_PASSWORD: rag_agent
      POSTGRES_DB: rag_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_agent -d rag_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  api_venv:
  postgres_data:
