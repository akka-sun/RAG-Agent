services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-agent-api-dev
    working_dir: /app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
